<text x="600" y="58" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#e8eef2">Built different, on purpose.</text><text x="600" y="88" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#93a3b3">Everything the alpha ships, and the ShweMind-only upgrades.</text><g>
