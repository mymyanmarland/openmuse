<text x="448" y="236" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#e8eef2">Own Linux Terminal</text>
<text x="448" y="264" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#93a3b3">Its own shell and workspace files,</text>
<text x="448" y="286" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#93a3b3">with saved receipts for every command.</text>
</g><g>
