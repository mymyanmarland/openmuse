<circle cx="1132" cy="382" r="6" fill="#00c9a7"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></circle>
<text x="838" y="468" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#e8eef2">Local-First Mode</text>
<text x="838" y="496" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#93a3b3">Runs fully without the Intelligence cloud key.</text>
<text x="838" y="518" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#93a3b3">Your server, your data.</text>
