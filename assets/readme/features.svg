<text x="448" y="468" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#e8eef2">zly168 Relay Ready</text>
<text x="448" y="496" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#93a3b3">Any OpenAI-compatible endpoint</text>
<text x="448" y="518" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#93a3b3">via OPENAI_BASE_URL. Your key, your bill.</text>
