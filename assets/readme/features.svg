<text x="58" y="264" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#93a3b3">Persistent Chromium. Watch it work inline,</text>
<text x="58" y="286" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#93a3b3">then take over the session yourself.</text>
</g><g>
<rect x="420" y="120" width="360" height="200" rx="16" fill="#101a22" stroke="#22303c" stroke-width="1.5"/>
